<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/css/layouts/reset.css">
  <!-- 부트스트랩 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- 공통 css -->
  <link rel="stylesheet" href="/css/layouts/common.css">
  <!-- page -->
  <link rel="stylesheet" href="/css/layouts/admin_layout.css">
  <link rel="stylesheet" href="/css/layouts/admin_header.css">
  <link rel="stylesheet" href="/css/layouts/admin_side.css">
  <th:block layout:fragment="content_css"></th:block>
</head>
<body>
  <div class="admin-container">
      <div class="admin-header">
        <th:block th:replace="~{layouts/admin_header::headerFragment}"></th:block>
      </div>
      <div class="admin-main">
        <div class="admin-side">
          <th:block th:replace="~{layouts/admin_side::sideFragment}"></th:block>
        </div>
        <div class="admin-content">
          <th:block layout:fragment="content"></th:block>
        </div>
      </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script> 
  <script src="/js/layouts/common.js"></script>
  <th:block layout:fragment="content_js"></th:block>
</body>
</html>
